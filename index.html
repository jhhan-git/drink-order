<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선생님 음료 주문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 가운데 좁은 한 줄 주문서 + 화면 아래 고정 제출 바 */
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --ink: #1d2420;
  --muted: #66706a;
  --line: #dde3dc;
  --accent: #0d7a4e;
  --accent-ink: #ffffff;
  --accent-soft: #e3f2ea;
  --ice: #2f6f9f;
  --ice-soft: #e4eef6;
  --hot: #b4512c;
  --hot-soft: #f8e9e2;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1a201d; --ink: #e6ebe7; --muted: #9aa59e; --line: #2c3530;
    --accent: #3fbf86; --accent-ink: #08130e; --accent-soft: #173327;
    --ice: #7fb6de; --ice-soft: #1a2a36; --hot: #e89470; --hot-soft: #362118;
    --danger: #f2877d; --danger-soft: #3a1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a201d; --ink: #e6ebe7; --muted: #9aa59e; --line: #2c3530;
  --accent: #3fbf86; --accent-ink: #08130e; --accent-soft: #173327;
  --ice: #7fb6de; --ice-soft: #1a2a36; --hot: #e89470; --hot-soft: #362118;
  --danger: #f2877d; --danger-soft: #3a1a17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  word-break: keep-all;
  padding-inline: 16px;
}
main { max-width: 560px; margin: 0 auto; padding-block: 32px 140px; display: grid; gap: 28px; }

header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.25; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; }

.field { display: grid; gap: 8px; }
.label { font-weight: 600; font-size: 16px; display: flex; align-items: baseline; gap: 6px; }
.req { color: var(--accent); font-size: 12px; font-weight: 600; }
input[type="text"], input[type="password"] {
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 14px; width: 100%;
}
input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.menu { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.menu legend { padding: 0; margin-bottom: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt label {
  display: grid; grid-template-columns: 22px auto 1fr; align-items: center; gap: 10px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 11px 14px; cursor: pointer; transition: border-color .12s, background .12s;
}
.opt label:hover { border-color: var(--muted); }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.opt input:checked + label .dot { border-color: var(--accent); background: var(--accent); }
.opt input:checked + label .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
.opt input:focus-visible + label { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.temp { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; }
.temp.ice { color: var(--ice); background: var(--ice-soft); }
.temp.hot { color: var(--hot); background: var(--hot-soft); }
.name { min-width: 0; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.summary { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary b { color: var(--ink); font-weight: 600; }
button {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; border: 0;
  padding: 12px 20px; background: var(--accent); color: var(--accent-ink);
}
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
button.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
button.small { padding: 6px 12px; font-size: 13px; }

.msg { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.msg.error { background: var(--danger-soft); color: var(--danger); }

/* 제출 완료 카드: 카페 영수증 느낌 */
.receipt {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 24px; display: grid; gap: 14px; text-align: center;
}
.receipt .who { font-family: var(--font-display); font-size: 22px; margin: 0; color: var(--ink); }
.receipt .what { font-size: 18px; font-weight: 600; margin: 0; color: var(--accent); }
.receipt hr { border: 0; border-top: 1.5px dashed var(--line); margin: 0; }
.receipt p { margin: 0; color: var(--muted); font-size: 14px; }

.foot { text-align: center; font-size: 13px; color: var(--muted); }
.foot a { color: var(--muted); }

/* 관리자 화면 */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.group { display: grid; gap: 6px; }
.group h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.group h3 .count { font-family: var(--font-mono); color: var(--accent); }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 14px;
}
.person button { background: transparent; color: var(--muted); padding: 0 8px; font-size: 16px; line-height: 1.4; border-radius: 999px; }
.person button:hover { color: var(--danger); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
textarea {
  width: 100%; font: 13px/1.6 var(--font-mono); color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; resize: vertical;
}
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- 주문 화면 -->
<main id="order-view">
  <header>
    <span class="eyebrow">교무실 음료 주문</span>
    <h1>오늘 마실 음료를 골라주세요</h1>
    <p class="lede">이름을 적고 음료를 하나 고른 뒤 제출하면 끝이에요. 로그인은 필요 없어요.</p>
  </header>

  <form id="order-form" novalidate>
    <div style="display:grid;gap:28px">
      <div class="field">
        <label class="label" for="teacher-name">이름 <span class="req">필수</span></label>
        <input type="text" id="teacher-name" maxlength="20" autocomplete="name" placeholder="예: 김민지">
      </div>

      <fieldset class="menu" id="menu">
        <legend class="label">음료선택 <span class="req">필수</span></legend>
      </fieldset>

      <div id="order-error" class="msg error" hidden></div>
    </div>
  </form>

  <p class="foot">이름을 똑같이 적고 다시 제출하면 이전 주문이 바뀌어요.<br><a href="#admin">주문 현황 보기 (담당자용)</a></p>
</main>

<div class="bar" id="order-bar">
  <div class="bar-inner">
    <div class="summary" id="summary">음료를 골라주세요</div>
    <button type="submit" form="order-form" id="submit-btn" disabled>제출하기</button>
  </div>
</div>

<!-- 제출 완료 화면 -->
<main id="done-view" hidden>
  <div class="receipt">
    <p id="done-note">주문이 접수됐어요</p>
    <p class="who" id="done-name"></p>
    <hr>
    <p class="what" id="done-drink"></p>
    <hr>
    <p>바꾸고 싶으면 같은 이름으로 다시 제출하면 돼요.</p>
  </div>
  <div class="row" style="justify-content:center">
    <button class="ghost" id="again-btn">다른 주문 하기</button>
  </div>
</main>

<!-- 담당자 화면 -->
<main id="admin-view" hidden>
  <header>
    <span class="eyebrow">담당자용</span>
    <h1>주문 현황</h1>
  </header>

  <form id="admin-login" class="field" novalidate>
    <label class="label" for="admin-pass">담당자 비밀번호</label>
    <div class="row">
      <input type="password" id="admin-pass" autocomplete="current-password" style="flex:1;min-width:0">
      <button type="submit">확인</button>
    </div>
    <div id="admin-error" class="msg error" hidden></div>
  </form>

  <section id="admin-body" hidden style="display:grid;gap:24px">
    <div class="stats">
      <div class="stat"><div class="k">주문한 사람</div><div class="v" id="stat-people">0</div></div>
      <div class="stat"><div class="k">음료 종류</div><div class="v" id="stat-kinds">0</div></div>    </div>

    <div class="row">
      <button class="ghost small" id="refresh-btn">새로고침</button>
      <button class="ghost small" id="copy-btn">카페 주문용 텍스트 복사</button>
      <button class="danger small" id="clear-btn">전체 비우기</button>
    </div>
    <div id="clear-confirm" class="confirm" hidden>
      <span>모든 주문을 지울까요? 지운 주문은 되돌릴 수 없어요.</span>
      <div class="row">
        <button class="danger small" id="clear-yes">네, 전부 지울게요</button>
        <button class="ghost small" id="clear-no">취소</button>
      </div>
    </div>

    <div id="groups" style="display:grid;gap:18px"></div>

    <div class="field">
      <label class="label" for="copy-text">카페에 보낼 내용</label>
      <textarea id="copy-text" rows="8" readonly></textarea>
    </div>
  </section>

  <p class="foot"><a href="#">← 주문 화면으로</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 공개돼도 괜찮은 값만 둔다 (anon 키). 실제 방어는 DB 함수와 RLS가 한다.
const SUPABASE_URL = "https://ooirdvyqpdtvxsmatwda.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vaXJkdnlxcGR0dnhzbWF0d2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTg4NTEsImV4cCI6MjEwNTk5NDg1MX0.FgFr8r5bEomarwCmgbbqgl64ca6bp0XqesTpOizBH5I";

// 메뉴는 페이지를 열 때마다 DB의 drink_menu 테이블에서 새로 불러온다.
// 브라우저가 옛 페이지를 캐시해 둬도 메뉴는 항상 DB와 같다.
// 아래 목록은 DB를 못 불러왔을 때 잠깐 보여줄 예비용.
const toItem = (label) => {
  const m = label.match(/^(ICE|HOT)\)\s*(.+)$/);
  return m ? { temp: m[1], name: m[2], label } : { temp: "", name: label, label };
};
let MENU = [
  ["ICE", "아메리카노"],
  ["HOT", "아메리카노"],
  ["ICE", "디카페인 콜드브루"],
  ["HOT", "디카페인 콜드브루"],
  ["ICE", "카페라떼"],
  ["HOT", "카페라떼"],
  ["ICE", "디카페인 카페라떼"],
  ["HOT", "디카페인 카페라떼"],
  ["ICE", "바닐라라떼"],
  ["HOT", "바닐라라떼"],
  ["ICE", "연유라떼"],
  ["ICE", "복숭아 아이스티"],
  ["ICE", "수제청 딸기라떼"],
  ["ICE", "리얼 수박주스"],
].map(([temp, name]) => toItem(`${temp}) ${name}`));

const $ = (id) => document.getElementById(id);
const db = window.supabase && !SUPABASE_URL.startsWith("__")
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// ---------- 주문 화면 ----------
const menuEl = $("menu");
function renderMenu() {
  const picked = selectedDrink();
  menuEl.querySelectorAll(".opt").forEach((el) => el.remove());
  MENU.forEach((m, i) => {
    const wrap = document.createElement("div");
    wrap.className = "opt";
    const input = document.createElement("input");
    input.type = "radio"; input.name = "drink"; input.id = "drink-" + i; input.value = m.label;
    input.checked = m.label === picked;
    const label = document.createElement("label");
    label.htmlFor = input.id;
    label.innerHTML = '<span class="dot"></span><span class="temp"></span><span class="name"></span>';
    const temp = label.querySelector(".temp");
    temp.textContent = m.temp;
    temp.classList.add(m.temp.toLowerCase() || "none");
    temp.hidden = !m.temp;
    label.querySelector(".name").textContent = m.name;
    wrap.append(input, label);
    menuEl.appendChild(wrap);
  });
  updateBar();
}
async function loadMenu() {
  if (!db) return;
  const { data, error } = await db.from("drink_menu").select("label").order("sort");
  if (error || !data || !data.length) return; // 못 불러오면 예비 목록 그대로
  MENU = data.map((r) => toItem(r.label));
  renderMenu();
}

function selectedDrink() {
  const r = document.querySelector('input[name="drink"]:checked');
  return r ? r.value : null;
}
function updateBar() {
  const name = $("teacher-name").value.trim();
  const drink = selectedDrink();
  $("submit-btn").disabled = !(name && drink);
  const s = $("summary");
  if (name && drink) s.innerHTML = "";
  if (name && drink) { s.append(name + " · "); const b = document.createElement("b"); b.textContent = drink; s.append(b); }
  else if (drink) s.textContent = "이름을 적어주세요";
  else s.textContent = "음료를 골라주세요";
}
$("teacher-name").addEventListener("input", updateBar);
menuEl.addEventListener("change", updateBar);

function showError(el, text) { el.textContent = text; el.hidden = !text; }

$("order-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("teacher-name").value.trim();
  const drink = selectedDrink();
  if (!name || !drink) return;
  if (!db) return showError($("order-error"), "주문 저장소가 아직 연결되지 않았어요. 담당자에게 알려주세요.");

  const btn = $("submit-btn");
  btn.disabled = true; btn.textContent = "보내는 중…";
  showError($("order-error"), "");
  const { data, error } = await db.rpc("submit_drink_order", { p_name: name, p_drink: drink });
  btn.textContent = "제출하기";
  updateBar();
  if (error) {
    if (error.message.includes("invalid_drink")) {
      await loadMenu();
      return showError($("order-error"), "고르신 음료가 메뉴에서 빠졌어요. 바뀐 메뉴에서 다시 골라주세요.");
    }
    if (error.message.includes("invalid_name")) {
      return showError($("order-error"), "이름은 1~20글자로 적어주세요.");
    }
    return showError($("order-error"), "제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.");
  }

  $("done-note").textContent = data.updated ? "이전 주문을 바꿨어요" : "주문이 접수됐어요";
  $("done-name").textContent = data.name + " 선생님";
  $("done-drink").textContent = data.drink;
  show("done");
});

$("again-btn").addEventListener("click", () => {
  $("order-form").reset();
  updateBar();
  show("order");
});

// ---------- 담당자 화면 ----------
let adminPass = "";
let lastRows = [];

$("admin-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  adminPass = $("admin-pass").value;
  await loadOrders();
});

async function loadOrders() {
  if (!db) return showError($("admin-error"), "주문 저장소가 아직 연결되지 않았어요.");
  const { data, error } = await db.rpc("admin_list_drink_orders", { p_pass: adminPass });
  if (error) {
    $("admin-body").hidden = true;
    return showError($("admin-error"), error.message.includes("wrong_pass") ? "비밀번호가 맞지 않아요." : "불러오지 못했어요. (" + error.message + ")");
  }
  showError($("admin-error"), "");
  $("admin-login").hidden = true;
  $("admin-body").hidden = false;
  lastRows = data;
  renderOrders();
}

function renderOrders() {
  const byDrink = new Map();
  for (const r of lastRows) {
    if (!byDrink.has(r.drink)) byDrink.set(r.drink, []);
    byDrink.get(r.drink).push(r);
  }
  // 메뉴판 순서대로 정렬
  const order = MENU.map((m) => m.label);
  const groups = [...byDrink.entries()].sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));

  $("stat-people").textContent = lastRows.length;
  $("stat-kinds").textContent = groups.length;

  const box = $("groups");
  box.innerHTML = "";
  if (!groups.length) {
    box.innerHTML = '<p class="lede">아직 들어온 주문이 없어요. 주문 화면 링크를 선생님들께 보내주세요.</p>';
  }
  for (const [drink, rows] of groups) {
    const g = document.createElement("div");
    g.className = "group";
    const h = document.createElement("h3");
    h.textContent = drink + " ";
    const c = document.createElement("span"); c.className = "count"; c.textContent = rows.length + "잔";
    h.appendChild(c);
    const people = document.createElement("div"); people.className = "people";
    for (const r of rows) {
      const p = document.createElement("span"); p.className = "person";
      p.append(r.teacher_name);
      const x = document.createElement("button");
      x.type = "button"; x.textContent = "×"; x.title = r.teacher_name + " 주문 지우기";
      x.setAttribute("aria-label", r.teacher_name + " 주문 지우기");
      x.addEventListener("click", () => deleteOne(r.id));
      p.appendChild(x);
      people.appendChild(p);
    }
    g.append(h, people);
    box.appendChild(g);
  }

  const lines = groups.map(([drink, rows]) => `${drink} ${rows.length}잔`);
  const total = lastRows.length;
  const detail = groups.map(([drink, rows]) => `- ${drink}: ${rows.map((r) => r.teacher_name).join(", ")}`);
  $("copy-text").value = total
    ? [...lines, `총 ${total}잔`, "", "[누가 무엇을]", ...detail].join("\n")
    : "";
}

async function deleteOne(id) {
  const { error } = await db.rpc("admin_delete_drink_order", { p_pass: adminPass, p_id: id });
  if (error) return showError($("admin-error"), "지우지 못했어요. (" + error.message + ")");
  await loadOrders();
}

$("refresh-btn").addEventListener("click", loadOrders);
$("clear-btn").addEventListener("click", () => { $("clear-confirm").hidden = false; });
$("clear-no").addEventListener("click", () => { $("clear-confirm").hidden = true; });
$("clear-yes").addEventListener("click", async () => {
  $("clear-confirm").hidden = true;
  const { error } = await db.rpc("admin_clear_drink_orders", { p_pass: adminPass });
  if (error) return showError($("admin-error"), "비우지 못했어요. (" + error.message + ")");
  await loadOrders();
});
$("copy-btn").addEventListener("click", async () => {
  const t = $("copy-text");
  try { await navigator.clipboard.writeText(t.value); $("copy-btn").textContent = "복사했어요"; }
  catch { t.select(); $("copy-btn").textContent = "선택됐어요. Ctrl+C로 복사"; }
  setTimeout(() => { $("copy-btn").textContent = "카페 주문용 텍스트 복사"; }, 2000);
});

// ---------- 화면 전환 (#admin 이면 담당자 화면) ----------
function show(view) {
  $("order-view").hidden = view !== "order";
  $("order-bar").hidden = view !== "order";
  $("done-view").hidden = view !== "done";
  $("admin-view").hidden = view !== "admin";
  window.scrollTo(0, 0);
}
function route() { show(location.hash === "#admin" ? "admin" : "order"); }
window.addEventListener("hashchange", route);
route();
renderMenu();
loadMenu();
</script>
</body>
</html>
